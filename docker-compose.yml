# Powerfarm LAB deployment — Mac mini, 24/7, headless.
# TLS terminates at the Cloudflare edge; cloudflared carries traffic into the
# lab through an outbound-only tunnel. No ports open on the lab router. Ever.
services:
  pf-worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}              # Supabase Postgres (pooler)
      POWERFARM_GENESIS_ROOT: ${GENESIS_ROOT_HASH}
    restart: unless-stopped
    # The worker is the ONLY lab process with a DB credential.
    # Agents never see DATABASE_URL.

  pf-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}          # model access only
      COMMIT_GATE_URL: http://pf-worker:8000/commit
    restart: unless-stopped
    depends_on: [pf-worker]

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on: [pf-worker]
