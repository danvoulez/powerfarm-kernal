# Conformance law map.
#
# The normative list of laws lives in the specification, not here. The checker
# (conformance/test_law_coverage.py) reads PF-NN identifiers out of the spec and
# fails when one of them has no classified status -- so adding a law to the
# constitution forces a decision here rather than being silently uncovered.
#
# Statuses are deliberately specific. A generic `waived = true` becomes a dusty
# trapdoor; these say *why*:
#
#   IMPLEMENTED           enforcement exists and executable tests prove it.
#                         Requires `tests`, and every path must exist.
#
#   ENFORCED_UNPROVEN     enforcement exists but nothing tries to violate it.
#                         Requires `enforced_by` and `tracked_by`. The set of
#                         laws in this state is frozen below -- adding one is an
#                         explicit edit, never a drift.
#
#   DESIGN_ONLY           the machinery does not exist yet.
#                         Requires `blocked_by`.
#
#   NOT_APPLICABLE        the law cannot apply to this component.
#                         Requires `reason`.
#
#   EXTERNAL_CONFORMANCE  proved against an external system or profile rather
#                         than the Kernel suite. Requires `profile`.
#
# The distinction that matters most is ENFORCED_UNPROVEN vs DESIGN_ONLY:
# "nobody proved it" is a different risk from "it isn't built".

# Laws currently enforced but unproven. Frozen: the checker fails if the actual
# set differs in either direction, so closing one requires deleting it here.
frozen_enforced_unproven = []


