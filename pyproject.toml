[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "powerfarm-kernel"
version = "0.1.0"
description = "A small constitutional kernel for governed, append-only history"
requires-python = ">=3.12"
dependencies = ["cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["kernel*", "genesis*", "worker*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["kernel", "genesis", "worker", "agent"]

