[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "powerfarm-kernel"
version = "0.1.0"
description = "A small constitutional kernel for governed, append-only history"
requires-python = ">=3.12"
dependencies = ["cryptography>=43", "rfc8785>=0.1"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pglast==8.4",
    "pytest>=8",
    "ruff>=0.7",
    "shellcheck-py==0.11.0.1",
]

[tool.setuptools.packages.find]
include = ["kernel*", "genesis*", "worker*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests", "conformance"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
packages = ["kernel", "genesis", "worker", "agent"]
